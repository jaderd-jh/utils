packages:
  - packages/*

overrides:
  is-core-module: npm:@nolyfill/is-core-module@^1
  safer-buffer: npm:@nolyfill/safer-buffer@^1
catalog:
  '@jhqn/eslint-config': ^1.0.2
  '@types/crypto-js': ^4.2.2
  '@types/node': ^24.13.5
  '@vitest/coverage-v8': ^5.0.1
  '@vueuse/core': ^14.4.0
  bumpp: ^12.3.0
  crypto-js: ^4.2.0
  dayjs: ^1.11.23
  detect-browser-es: 0.1.1
  eslint: ^10.10.0
  eslint-plugin-oxlint: ^1.83.0
  jsdom: ^30.0.1
  lint-staged: ^17.5.1
  nanoid: ^6.0.1
  npm-run-all2: ^9.0.3
  oxfmt: ^0.68.0
  oxlint: ^1.83.0
  publint: ^0.3.24
  simple-git-hooks: ^2.14.0
  tsdown: ^0.23.0
  typescript: ^6.0.3
  vite: ^8.3.0
  vitest: ^5.0.1

cleanupUnusedCatalogs: true

dedupeDirectDeps: true

dedupePeers: true

dedupePeerDependents: true

onlyBuiltDependencies:
  - msw

allowBuilds:
  esbuild: false
  msw: false
  simple-git-hooks: false
  unrs-resolver: false

update:
  githubActions: true
