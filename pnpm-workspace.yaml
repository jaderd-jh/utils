packages:
  - packages/*

overrides:
  is-core-module: npm:@nolyfill/is-core-module@^1
  safer-buffer: npm:@nolyfill/safer-buffer@^1
catalog:
  '@jhqn/eslint-config': ^0.15.3
  '@types/crypto-js': ^4.2.2
  '@types/node': ^24.13.3
  '@vitest/coverage-v8': ^4.1.10
  '@vueuse/core': ^14.3.0
  bumpp: ^12.0.0
  crypto-js: ^4.2.0
  dayjs: ^1.11.21
  detect-browser-es: 0.1.1
  eslint: ^10.7.0
  eslint-plugin-oxlint: ^1.73.0
  jsdom: ^29.1.1
  lint-staged: ^17.1.0
  nanoid: ^6.0.0
  npm-run-all2: ^9.0.2
  oxfmt: ^0.59.0
  oxlint: ^1.74.0
  publint: ^0.3.21
  simple-git-hooks: ^2.13.1
  tsdown: ^0.22.9
  typescript: ^6.0.3
  vite: ^8.1.5
  vitest: ^4.1.10

cleanupUnusedCatalogs: true

dedupeDirectDeps: true

dedupePeers: true

dedupePeerDependents: true

onlyBuiltDependencies:
