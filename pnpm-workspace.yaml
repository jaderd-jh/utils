packages:
  - packages/*

overrides:
  is-core-module: npm:@nolyfill/is-core-module@^1
  safer-buffer: npm:@nolyfill/safer-buffer@^1
catalog:
  '@jhqn/eslint-config': ^1.0.2
  '@noble/ciphers': ^2.4.0
  '@noble/hashes': ^2.4.0
  '@scure/base': ^2.4.0
  '@types/node': ^24.19.0
  '@vitest/browser': ^5.0.3
  '@vitest/browser-playwright': ^5.0.3
  '@vitest/coverage-v8': ^5.0.3
  '@vueuse/core': ^15.0.0
  bumpp: ^12.3.0
  dayjs: ^1.11.23
  detect-browser-es: 0.1.1
  eslint: ^10.12.0
  eslint-plugin-oxlint: ^1.87.0
  jotai: ^3.0.1
  jsdom: ^30.1.2
  lint-staged: ^17.6.0
  nanoid: ^6.0.2
  npm-run-all2: ^9.0.3
  oxfmt: ^0.75.0
  oxlint: ^1.87.0
  playwright: ^1.64.0
  publint: ^0.3.25
  simple-git-hooks: ^2.14.0
  tsdown: ^0.23.1
  typescript: ^6.0.3
  vite: ^8.3.4
  vitest: ^5.0.3
cleanupUnusedCatalogs: true

dedupeDirectDeps: true

dedupePeers: true

dedupePeerDependents: true

onlyBuiltDependencies:
  - msw

allowBuilds:
  esbuild: false
  msw: false
  simple-git-hooks: false
  unrs-resolver: false

update:
  githubActions: true
